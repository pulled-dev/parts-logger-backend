# Canonical part types for VAG breaking.
#
# Rules are tried top to bottom against the NORMALISED part name (see
# scripts/part_classifier.py: upper case, "A BAG"/"ABAG"/"AIR BAG" -> AIRBAG,
# "SEAT BELT" -> SEATBELT, "HEADLAMP" -> HEADLIGHT, punctuation -> spaces).
# The first type with a matching pattern wins, so specific types sit above
# general ones. Side/position (front/rear, driver/passenger, pair) is a
# separate attribute and must NOT become its own type.
#
# fitment_level: "generation" (fits one model generation: headlights, door
# panels, dash ...) or "platform" (shared across a platform such as MQB or
# PQ35: engines, gearboxes, steering racks, ABS pumps ...). Shelf targets
# group stock and sales at this level. "# guess" = please check.
#
# confidence: rule confidence (default 0.95). Catch-all types use < 0.95 and
# ambiguous ones < 0.7 so they land in analytics/review_queue.csv.

types:
  # --- not a part ---------------------------------------------------------
  - id: vehicle_listing
    label: Breaking-for-spares ad (not a part)
    fitment_level: generation
    patterns: ['BREAKING FOR SPARES', '^BREAKING\b']

  # --- airbags / SRS (before anything matching STEERING, SEAT, DASH) -------

  - id: airbag_squib_slip_ring
    label: Airbag squib / slip ring / clock spring
    fitment_level: generation
    patterns: ['SQUIB', 'SLIP RING', 'CLOCK ?SPRING', 'SLIPRING']

