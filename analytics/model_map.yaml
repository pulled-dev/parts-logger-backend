# Raw BreakerPro make/model strings -> make + model + generation.
#
# Applied by scripts/analytics_build.py (normalise_model). Matching runs on the
# upper-cased model string with punctuation turned into spaces ("E-GOLF" ->
# "E GOLF", "GOLF MK7.5" -> "GOLF MK7 5").
#
#   1. make: the raw make, through make_aliases.
#   2. model: the first entry under that make whose `match` pattern hits. Order
#      matters: specific models (Golf Plus, Golf SV, e-Golf) sit above Golf.
#   3. generation, in this order:
#        - a generation code written in the string (any of `codes`, as a whole
#          word; MK7.5 counts as MK7, B8.5 as B8)
#        - else the year of manufacture, inside a generation's `years` range
#          (inclusive; changeover years go to one side, noted per model)
#        - else, for a model with one generation, that generation
#        - else "gen unknown" (reported, not guessed)
#   Anything with no matching model is listed as unmapped in the build output.
#
# Year ranges are UK registration years, approximate at changeovers.

make_aliases:
  VW: VOLKSWAGEN
  VOLKSWAGON: VOLKSWAGEN
  VOLKSWGAEN: VOLKSWAGEN
  MERCEDES BENZ: MERCEDES
  MERCEDES-BENZ: MERCEDES

make_labels:
  VOLKSWAGEN: VW
  AUDI: Audi
  SEAT: SEAT
  SKODA: Skoda
  CUPRA: Cupra
  LEVC: LEVC
  MERCEDES: Mercedes
  MINI: MINI

models:
  VOLKSWAGEN:
    - model: e-Golf
      match: '\bE GOLF\b'
      generations:
        - {gen: MK7, codes: [MK7], years: [2014, 2020]}
    - model: Golf Plus
      match: '\bGOLF PLUS\b'
      generations:
        - {gen: 5M, codes: [5M], years: [2005, 2014]}
    - model: Golf SV
      match: '\bGOLF (SV|SPORTSVAN)\b'
      generations:
        - {gen: AM, codes: [AM], years: [2014, 2020]}
    - model: Golf
      match: '\bGOLF\b'
      generations:
        - {gen: MK4, codes: [MK4, 1J], years: [1997, 2003]}
        - {gen: MK5, codes: [MK5], years: [2004, 2008]}
        - {gen: MK6, codes: [MK6, 5K], years: [2009, 2012]}
        - {gen: MK7, codes: [MK7, 5G], years: [2013, 2019]}
        - {gen: MK8, codes: [MK8, CD], years: [2020, 2030]}
    - model: Polo
      match: '\bPOLO\b'
      # 2009 goes to 6R (launched mid-2009); a 2009 9N3 must say 9N3.
      # 2017 goes to 2G (AW, launched late 2017); a 2017 6C must say 6C.
      generations:
        - {gen: 9N3, codes: [9N3, 9N], years: [2002, 2008]}
        - {gen: 6R, codes: [6R], years: [2009, 2013]}
        - {gen: 6C, codes: [6C], years: [2014, 2016]}
        - {gen: 2G, codes: [2G, AW, MK6], years: [2017, 2030]}
    - model: up!
      match: '\bUP\b'
      generations:
        - {gen: 121, codes: [], years: [2012, 2024]}
    - model: Fox
      match: '\bFOX\b'
      generations:
        - {gen: 5Z, codes: [5Z], years: [2005, 2011]}
    - model: Passat CC
      match: '\bPASSAT CC\b|^CC\b'
      generations:
        - {gen: 35, codes: [], years: [2008, 2016]}
    - model: Passat
      match: '\bPASSAT\b'
      # 3A is how the yard writes the B7; 3G is the B8 chassis code.
      # 2015 goes to B8 (launched late 2014).
      generations:
        - {gen: B6, codes: [B6, 3C], years: [2005, 2010]}
        - {gen: B7, codes: [B7, 3A], years: [2011, 2014]}
        - {gen: B8, codes: [B8, 3G], years: [2015, 2023]}
        - {gen: B9, codes: [B9], years: [2024, 2030]}
    - model: Jetta
      match: '\bJETTA\b'
      generations:
        - {gen: MK5, codes: [MK5, 1K], years: [2005, 2010]}
        - {gen: 5C, codes: [5C, MK6], years: [2011, 2018]}
    - model: Scirocco
      match: '\bSCIROCCO\b'
      generations:
        - {gen: MK3, codes: [MK3, 13], years: [2008, 2017]}
    - model: Tiguan
      match: '\bTIGUAN\b'
      generations:
        - {gen: MK1, codes: [MK1, 5N], years: [2007, 2015]}
        - {gen: MK2, codes: [MK2, AD], years: [2016, 2023]}
        - {gen: MK3, codes: [MK3], years: [2024, 2030]}
    - model: Touran
      match: '\bTOURAN\b'
      # 1T3 is the 2010-2015 facelift of the 1T.
      generations:
        - {gen: 1T, codes: [1T, 1T3], years: [2003, 2015]}
        - {gen: 5T, codes: [5T], years: [2016, 2030]}
    - model: Sharan
      match: '\bSHARAN\b'
      generations:
        - {gen: 7M, codes: [7M], years: [1995, 2009]}
        - {gen: 7N, codes: [7N], years: [2010, 2022]}
    - model: Caddy
      match: '\bCADDY\b'
      # C20 is a Caddy van variant code, not a generation.
      generations:
        - {gen: 2K, codes: [2K], years: [2004, 2020]}
        - {gen: SB, codes: [SB, MK5], years: [2021, 2030]}
    - model: Transporter
      match: '\bTRANSPORTER\b'
      generations:
        - {gen: T5, codes: [T5], years: [2003, 2015]}
        - {gen: T6, codes: [T6], years: [2016, 2030]}
    - model: T-Roc
      match: '\bT ROC\b'
      generations:
        - {gen: A1, codes: [], years: [2017, 2030]}
    - model: T-Cross
      match: '\bT CROSS\b'
      generations:
        - {gen: C1, codes: [], years: [2019, 2030]}
    - model: Beetle
      match: '\bBEETLE\b'
      generations:
        - {gen: 5C, codes: [5C], years: [2011, 2019]}
    - model: Eos
      match: '\bEOS\b'
      generations:
        - {gen: 1F, codes: [1F], years: [2006, 2015]}
    - model: Touareg
      match: '\bTOUAREG\b'
      generations:
        - {gen: 7P, codes: [7P], years: [2010, 2018]}
        - {gen: CR, codes: [CR], years: [2018, 2030]}
    - model: Arteon
      match: '\bARTEON\b'
      generations:
        - {gen: 3H, codes: [3H], years: [2017, 2030]}

  AUDI:
    - model: A1
      match: '\bA1\b'
      generations:
        - {gen: 8X, codes: [8X], years: [2010, 2018]}
        - {gen: GB, codes: [GB], years: [2019, 2030]}
    - model: A3
      match: '\b(A3|S3|RS3)\b'
      generations:
        - {gen: 8L, codes: [8L], years: [1996, 2002]}
        - {gen: 8P, codes: [8P], years: [2003, 2012]}
        - {gen: 8V, codes: [8V], years: [2013, 2019]}
        - {gen: 8Y, codes: [8Y], years: [2020, 2030]}
    - model: A4
      match: '\b(A4|S4|RS4)\b'
      # 2008 goes to B8 (launched 2008); a 2008 B7 must say B7.
      generations:
        - {gen: B6, codes: [B6], years: [2001, 2004]}
        - {gen: B7, codes: [B7], years: [2005, 2007]}
        - {gen: B8, codes: [B8, 8K], years: [2008, 2015]}
        - {gen: B9, codes: [B9, 8W], years: [2016, 2030]}
    - model: A5
      match: '\b(A5|S5|RS5)\b'
      generations:
        - {gen: 8T, codes: [8T], years: [2007, 2016]}
        - {gen: F5, codes: [F5], years: [2017, 2030]}
    - model: A6
      match: '\b(A6|S6|RS6)\b'
      generations:
        - {gen: C6, codes: [C6, 4F], years: [2004, 2010]}
        - {gen: C7, codes: [C7, 4G], years: [2011, 2017]}
        - {gen: C8, codes: [C8, 4K], years: [2018, 2030]}
    - model: Q3
      match: '\bQ3\b'
      generations:
        - {gen: 8U, codes: [8U], years: [2011, 2018]}
        - {gen: F3, codes: [F3], years: [2019, 2030]}
    - model: Q5
      match: '\b(Q5|SQ5)\b'
      generations:
        - {gen: 8R, codes: [8R], years: [2008, 2016]}
        - {gen: FY, codes: [FY], years: [2017, 2030]}
    - model: TT
      match: '\bTT\b'
      generations:
        - {gen: MK1, codes: [MK1, 8N], years: [1998, 2005]}
        - {gen: MK2, codes: [MK2, 8J], years: [2006, 2014]}
        - {gen: MK3, codes: [MK3, 8S], years: [2015, 2023]}

  SEAT:
    - model: Ibiza
      match: '\bIBIZA\b'
      # MK5 is how the yard writes the 6F. 2017 goes to 6F (launched mid-2017);
      # a 2017 6J must say 6J.
      generations:
        - {gen: 6L, codes: [6L, MK3], years: [2002, 2007]}
        - {gen: 6J, codes: [6J, MK4], years: [2008, 2016]}
        - {gen: 6F, codes: [6F, MK5], years: [2017, 2030]}
    - model: Leon
      match: '\bLEON\b'
      generations:
        - {gen: MK1, codes: [MK1, 1M], years: [1999, 2004]}
        - {gen: MK2, codes: [MK2, 1P], years: [2005, 2012]}
        - {gen: MK3, codes: [MK3, 5F], years: [2013, 2019]}
        - {gen: MK4, codes: [MK4, KL], years: [2020, 2030]}
    - model: Altea
      match: '\bALTEA\b'
      generations:
        - {gen: 5P, codes: [5P], years: [2004, 2015]}
    - model: Alhambra
      match: '\bALHAMBRA\b'
      generations:
        - {gen: 7M, codes: [7M], years: [1996, 2009]}
        - {gen: 7N, codes: [7N], years: [2010, 2020]}
    - model: Ateca
      match: '\bATECA\b'
      generations:
        - {gen: KH, codes: [KH], years: [2016, 2030]}
    - model: Arona
      match: '\bARONA\b'
      generations:
        - {gen: KJ, codes: [KJ], years: [2017, 2030]}
    - model: Mii
      match: '\bMII\b'
      generations:
        - {gen: KF, codes: [KF], years: [2012, 2021]}
    - model: Toledo
      match: '\bTOLEDO\b'
      generations:
        - {gen: NH, codes: [NH], years: [2012, 2019]}

  SKODA:
    - model: Fabia
      match: '\bFABIA\b'
      # The yard writes the Mk2 as 5J, and Mk3/Mk4 as MK3/MK4.
      generations:
        - {gen: 6Y, codes: [6Y, MK1], years: [2000, 2006]}
        - {gen: 5J, codes: [5J, MK2], years: [2007, 2014]}
        - {gen: NJ, codes: [NJ, MK3], years: [2015, 2021]}
        - {gen: PJ, codes: [PJ, MK4], years: [2022, 2030]}
    - model: Octavia
      match: '\bOCTAVIA\b'
      generations:
        - {gen: MK2, codes: [MK2, 1Z], years: [2004, 2012]}
        - {gen: MK3, codes: [MK3, 5E], years: [2013, 2019]}
        - {gen: MK4, codes: [MK4, NX], years: [2020, 2030]}
    - model: Superb
      match: '\bSUPERB\b'
      generations:
        - {gen: 3T, codes: [3T, MK2], years: [2008, 2014]}
        - {gen: 3V, codes: [3V, MK3], years: [2015, 2023]}
    - model: Citigo
      match: '\bCITIGO\b'
      generations:
        - {gen: NF, codes: [NF], years: [2012, 2020]}
    - model: Yeti
      match: '\bYETI\b'
      generations:
        - {gen: 5L, codes: [5L], years: [2009, 2017]}
    - model: Rapid
      match: '\bRAPID\b'
      generations:
        - {gen: NH, codes: [NH], years: [2012, 2019]}
    - model: Roomster
      match: '\bROOMSTER\b'
      generations:
        - {gen: 5J, codes: [5J], years: [2006, 2015]}
    - model: Kodiaq
      match: '\bKODIAQ\b'
      generations:
        - {gen: NS, codes: [NS], years: [2016, 2030]}
    - model: Karoq
      match: '\bKAROQ\b'
      generations:
        - {gen: NU, codes: [NU], years: [2017, 2030]}

  LEVC:
    - model: TX
      match: '\bTX\b'
      generations:
        - {gen: TX, codes: [], years: [2018, 2030]}

  MERCEDES:
    - model: Citan
      match: '\bCITAN\b'
      generations:
        - {gen: W415, codes: [W415], years: [2012, 2021]}

  MINI:
    - model: Hatch
      match: '\b(HATCH|ONE|COOPER)\b'
      generations:
        - {gen: R50/R53, codes: [R50, R52, R53], years: [2001, 2006]}
        - {gen: R56, codes: [R56], years: [2007, 2013]}
        - {gen: F56, codes: [F56], years: [2014, 2030]}
