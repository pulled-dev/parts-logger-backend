  - id: airbag_control_module
    label: Airbag control module (SRS ECU)
    fitment_level: generation
    patterns: ['AIRBAG (CONTROL )?(MODULE|ECU|UNIT)', 'SRS (AIRBAG )?(MODULE|ECU)']
    confidence: 0.85

  - id: airbag_kit
    label: Airbag kit (set with module)
    fitment_level: generation
    patterns: ['AIRBAG KIT', 'SRS KIT', 'AIRBAG SET']

  - id: airbag_other
